info:
  name: Successful Login With Email
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:5001/api/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "login": "logintestuser@example.com",
        "password": "TestPass123!"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
