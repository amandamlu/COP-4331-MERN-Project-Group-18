info:
  name: Current User Invalid Token
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:5001/api/auth/me
  headers:
    - name: Authorization
      value: Bearer not.a.real.token
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 401

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false