info:
  name: Wrong Password
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:5001/api/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "login": "logintestuser",
        "password": "NotThePassword"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 401

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false