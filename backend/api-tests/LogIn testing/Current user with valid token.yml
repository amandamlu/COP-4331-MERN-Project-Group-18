info:
  name: Current User With Valid Token
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:5001/api/auth/me
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
