info:
  name: "Delete - valid id"
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/api/applications/{{applicationId}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200 with confirmation", function () {
          expect(res.status).to.equal(200);
          expect(res.body.message).to.be.a("string");
          expect(res.body.id).to.equal(bru.getVar("applicationId"));
        });

settings:
  encodeUrl: true
