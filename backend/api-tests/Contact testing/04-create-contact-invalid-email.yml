info:
  name: "Create contact - invalid email"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/applications/{{contactAppId}}/contacts"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "Name": "Bad Email",
        "Email": "not-an-email"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400 with validation details", function () {
          expect(res.status).to.equal(400);
          expect(res.body.details).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
