info:
  name: "List contacts"
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/applications/{{contactAppId}}/contacts"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200 with the contact", function () {
          expect(res.status).to.equal(200);
          expect(res.body.data.map(c => c._id)).to.include(bru.getVar("contactId"));
          expect(res.body.total).to.equal(res.body.data.length);
        });

        test("every contact belongs to this application", function () {
          res.body.data.forEach(c => expect(c.ApplicationId).to.equal(bru.getVar("contactAppId")));
        });

settings:
  encodeUrl: true
