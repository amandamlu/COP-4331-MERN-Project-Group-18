info:
  name: "Delete contact"
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/api/applications/{{contactAppId}}/contacts/{{contactId}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("contactId"));
        });

settings:
  encodeUrl: true
