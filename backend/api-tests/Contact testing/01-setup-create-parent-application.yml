info:
  name: "Setup - create parent application"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/applications"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "Company": "Bruno Contact Co",
        "Role": "Intern"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("contactAppId", res.body._id);
    - type: tests
      code: |-
        test("returns 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
